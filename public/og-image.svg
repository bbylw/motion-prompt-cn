<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#07080d"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.4"/>
  <defs>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M 56 0 L 0 0 0 56" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff6b4a"/>
      <stop offset="100%" stop-color="#ff8f6b"/>
    </linearGradient>
  </defs>
  
  <!-- 左侧装饰线 -->
  <line x1="80" y1="180" x2="80" y2="450" stroke="url(#accent)" stroke-width="2"/>
  
  <!-- 标题 -->
  <text x="120" y="240" font-family="Space Grotesk, Arial, sans-serif" font-size="56" font-weight="700" fill="#f8fafc">Motion Prompt</text>
  <text x="120" y="300" font-family="Instrument Sans, Arial, sans-serif" font-size="28" fill="#94a3b8">192 个动态图形名称，为 AI 生成视频而生</text>
  
  <!-- 标签 -->
  <rect x="120" y="340" width="90" height="36" rx="18" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.1"/>
  <text x="165" y="363" font-family="monospace" font-size="14" fill="#94a3b8" text-anchor="middle">192 元素</text>
  
  <rect x="222" y="340" width="90" height="36" rx="18" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.1"/>
  <text x="267" y="363" font-family="monospace" font-size="14" fill="#94a3b8" text-anchor="middle">8 大主题</text>
  
  <rect x="324" y="340" width="110" height="36" rx="18" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.1"/>
  <text x="379" y="363" font-family="monospace" font-size="14" fill="#94a3b8" text-anchor="middle">实时预览</text>
  
  <!-- 右侧动画示意：三个运动图形 -->
  <!-- 弹性圆 -->
  <circle cx="920" cy="280" r="50" fill="url(#accent)" opacity="0.9"/>
  <circle cx="920" cy="280" r="70" stroke="url(#accent)" stroke-width="2" opacity="0.3"/>
  <circle cx="920" cy="280" r="90" stroke="url(#accent)" stroke-width="1" opacity="0.1"/>
  
  <!-- 速度线 -->
  <line x1="820" y1="400" x2="1020" y2="400" stroke="#f8fafc" stroke-opacity="0.2" stroke-width="2"/>
  <line x1="850" y1="420" x2="990" y2="420" stroke="#f8fafc" stroke-opacity="0.1" stroke-width="2"/>
  <line x1="880" y1="440" x2="960" y2="440" stroke="#f8fafc" stroke-opacity="0.05" stroke-width="2"/>
  
  <!-- 底部文字 -->
  <text x="120" y="540" font-family="monospace" font-size="16" fill="#64748b">motion-prompt · Canvas 2D · 零依赖</text>
</svg>